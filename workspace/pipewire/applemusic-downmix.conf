# The Atmos 9.1.6 downmix's own PipeWire process. applemusic-downmix.service runs
# `pipewire -c applemusic-downmix.conf`; the downmix itself is the drop-in
# applemusic-downmix.conf.d/atmos-916-downmix.conf (tools/downmix.py writes it).
# Why a process of its own: the desktop's volume mixer hides streams that have no client, as the daemon's
# own filter-chain streams are, and labels the others "<client name>: <media.name>". As a client named "Apple
# Music", the downmix's output shows as "Apple Music: Atmos 9.1.6 Downmix" with a volume slider of its own: the
# music's volume apart from other apps (the player's own volume is another control, inside the downmix).
# The rest is PipeWire's own filter-chain.conf.
context.properties = {
    log.level             = 0
    application.name      = "Apple Music"
    application.icon_name = "applemusic-bridge"
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
]
