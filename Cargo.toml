# am-ui: the engine (crates/engine) and the GTK application built on it.
# The prototypes of the toolkit study and the helper sources under workspace/ and tools/ are
# separate Cargo projects with their own lock files.
[workspace]
members = ["crates/engine", "crates/app"]
exclude = ["proto", "bench", "workspace", "tools", "var", "notes-local"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_8"] }
async-channel = "2"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_20"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lru = "0.16"
mpris-server = "0.11"
base64 = "0.22"
libc = "0.2"
libpulse-binding = "2.30"
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
url = "2"
zbus = "6"

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 4
